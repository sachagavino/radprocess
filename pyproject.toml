[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "radprocess"
version = "0.1.0"
description = "A package that runs a postprocessing pipeline of MHD simulations using multi-fluids models."
readme = "README.md"
authors = [{name = "Sacha Gavino and Ilseung Han", email = "sacha.gavino@unibo.it"}]
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.0,<3",
    "scipy",
    "zarr>=3.0,<4",
    "numcodecs",
    "matplotlib",
    "rich",
    "astropy",
]

[project.optional-dependencies]
gui = ["gradio"]
dev = ["pytest", "ruff"]

[project.scripts]
radprocess = "radprocess.cli:main"